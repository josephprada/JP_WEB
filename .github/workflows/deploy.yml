name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jp_web_deploy
          chmod 600 ~/.ssh/jp_web_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete --no-owner --no-group --no-perms --omit-dir-times \
            -e "ssh -i ~/.ssh/jp_web_deploy -p ${PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "${USER}@${HOST}:/var/www/jp-web/"

      - name: Fix ownership
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/jp_web_deploy -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER}@${HOST}" 'sudo chown -R nginx:nginx /var/www/jp-web'
